name: Claude Code (Working on Forgejo)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@claude'))
    runs-on: docker
    container:
      image: denkhaus/golang-claude-action:latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      TZ: Europe/Berlin

    steps:
      - name: Add eyes reaction to indicate processing started
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FORGEJO_TOKEN }}
          script: |
            console.log('Adding eyes reaction to indicate processing started...');

            try {
              if (context.eventName === 'issue_comment') {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                });
                console.log('Added eyes reaction to comment');
              } else if (context.eventName === 'issues') {
                await github.rest.reactions.createForIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  content: 'eyes'
                });
                console.log('Added eyes reaction to issue');
              } else if (context.eventName === 'pull_request') {
                await github.rest.reactions.createForIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  content: 'eyes'
                });
                console.log('Added eyes reaction to pull request');
              }
            } catch (error) {
              console.log('Failed to add reaction:', error.message);
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract prompt from event
        id: extract_prompt
        working-directory: /opt
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: mage github:extractprompt

      - name: Run Claude Code Base Action
        id: claude
        uses: anthropics/claude-code-base-action@main
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: ${{ steps.extract_prompt.outputs.prompt_file }}
          settings: '{"allowedTools": ["Bash", "Edit", "Read", "Write", "Grep", "Glob"], "allowedBashCommands": ["go build", "go test", "go fmt", "gofmt", "go vet", "go mod tidy", "go generate", "golangci-lint run", "mockgen"]}'
          claude_args: "--model claude-sonnet-4-20250514"

      - name: Create Pull Request if changes were made
        if: success()
        working-directory: /opt
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          ISSUE_NUMBER: ${{ steps.extract_prompt.outputs.issue_number }}
        run: mage github:createpr

      - name: Add completion reaction
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FORGEJO_TOKEN }}
          script: |
            let status = "${{ steps.claude.outcome }}";
            let reactionContent = status === 'success' ? '+1' : '-1';

            // Add completion reaction
            try {
              if (context.eventName === 'issue_comment') {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: reactionContent
                });
              } else if (context.eventName === 'issues') {
                await github.rest.reactions.createForIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  content: reactionContent
                });
              } else if (context.eventName === 'pull_request') {
                await github.rest.reactions.createForIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  content: reactionContent
                });
              }
              console.log(`Added ${reactionContent} reaction for completion`);
            } catch (error) {
              console.log('Failed to add completion reaction:', error.message);
            }
