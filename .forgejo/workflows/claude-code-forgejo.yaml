name: Claude Code (Working on Forgejo)

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@claude'))
    runs-on: docker
    container:
      image: denkhaus/golang-claude-action:latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add eyes reaction to indicate processing started
        working-directory: /opt
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mage github:addstartreaction

      - name: Extract prompt from event
        id: extract_prompt
        working-directory: /opt
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: mage github:extractprompt

      - name: Run Claude Code Base Action
        id: claude
        uses: anthropics/claude-code-base-action@main
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: ${{ steps.extract_prompt.outputs.prompt_file }}
          settings: '{"allowedTools": ["Bash", "Edit", "Read", "Write", "Grep", "Glob"], "allowedBashCommands": ["go build", "go test", "go fmt", "gofmt", "go vet", "go mod tidy", "go generate", "golangci-lint run", "mockgen", "find", "staticcheck"]}'
          claude_args: "--model claude-sonnet-4-20250514"

      - name: Create Pull Request if changes were made
        if: success()
        working-directory: /opt
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          ISSUE_NUMBER: ${{ steps.extract_prompt.outputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mage github:createpr

      - name: Add completion reaction
        if: always()
        working-directory: /opt
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mage github:addendreaction ${{ steps.claude.outcome == 'success' }}
